<!DOCTYPE html>
<html lang="ja">
<head>

  <title>チーム紹介サイト</title>
  <!-- Tailwind CSS（CDN版）: インストール不要で使えます -->

<body class="bg-gray-50 text-gray-800">

  <!-- =========================================================

      <p class="text-xl font-bold">Team Site</p>
      <ul class="flex gap-6 text-sm">
        <li><a href="#hero" class="hover:text-blue-600">トップ</a></li>
        <li><a href="#members" class="hover:text-blue-600">メンバー</a></li>
        <li><a href="#footer" class="hover:text-blue-600">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>


  <main>

    <section id="hero" class="bg-gray-300 py-20">

        <!-- TODO(Issue #1): チーム名に書き換えてください -->

      <div class="max-w-4xl mx-auto px-4">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

              🙂

            <h3 class="text-lg font-bold">ねぎちゃん</h3>
            <p class="text-sm text-gray-500 mb-2">調達屋</p>
            <p class="text-sm">ときどきレアもの混ぜるぜ</p>
          </div>
          <!-- ▲ メンバーカード 1人分（ここまで） -->

          <!-- TODO(Issue #2): 上のカードをコピーして、3人分にしてください -->
 <div class="bg-white rounded-lg shadow p-6 text-center">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gray-200 flex items-center justify-center text-3xl">
              🙂
            </div>
            <h3 class="text-lg font-bold">かほ</h3>
      
            <p class="text-sm text-gray-500 mb-2">ばらまき屋</p>
            <p class="text-sm">街の隅々まで残さずばらまく
        
            </p>
          </div>

           <div class="bg-white rounded-lg shadow p-6 text-center">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gray-200 flex items-center justify-center text-3xl">
              🙂
            </div>
            <h3 class="text-lg font-bold">りさ</h3>
            <p class="text-sm text-gray-500 mb-2">広報</p>
            <p class="text-sm">街の子供にこっそり伝える</p>
          </div>
          
        </div>
      </div>

    <div class="max-w-4xl mx-auto px-4 text-center">
